[package]
name = "az-snp-vtpm-verifier"
version = "0.1.0"
edition = "2024"

[dependencies]
bitvec = "1.1.1"
hex = "0.4.3"
jsonwebkey = { version = "0.4.0", features = ["pkcs-convert"] }
openssl = "0.10.82"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = { version = "3.24.0", features = ["hex"] }
sev = "9.0.0"
tpm2-crypto = "1.2.3"
tpm2-protocol = "1.2.3"
zerocopy = { version = "0.8.63", features = ["derive"] }
